# ==============================================================================
# VinFast Face Landmark VF-50 Specification & Threshold Configuration
# NGUỒN SỰ THẬT DUY NHẤT (SINGLE SOURCE OF TRUTH) CHO RULE VÀ SCORING
#
# LƯU Ý QUAN TRỌNG:
# 1. Các ngưỡng bên dưới CHƯA được hiệu chỉnh bằng dữ liệu benchmark/thực nghiệm.
# 2. R08 được đặt là 1.55 (trong tài liệu cũ ghi 1.45) để khớp đúng với mã nguồn
#    đang chạy và characterization test hiện hành, tránh báo động giả.
# 3. R13 dùng ngưỡng thích ứng theo scale: max(5.0, 15.0 * scale_factor) px
#    (trong tài liệu cũ chỉ ghi tĩnh 15.0 px).
# ==============================================================================

schema_id: vf_face_landmark50_v1
name: VinFast Face Landmark VF-50
version: "1.3"
image_size:
  width: 1280
  height: 720

skeletons:
  - name: longmaytrai
    point_range: [0, 4]
    point_count: 5
    closed: false
    proportions: [0.00, 0.15, 0.41, 0.73, 1.00]
    description: "Bờ trên lông mày trái (nhìn trên ảnh), chạy từ đuôi ngoài vào đầu trong"

  - name: longmayphai
    point_range: [5, 9]
    point_count: 5
    closed: false
    proportions: [0.00, 0.26, 0.58, 0.85, 1.00]
    description: "Bờ trên lông mày phải (nhìn trên ảnh), chạy từ đầu trong ra đuôi ngoài"

  - name: songmui
    point_range: [10, 13]
    point_count: 4
    closed: false
    proportions: [0.00, 0.34, 0.67, 1.00]
    description: "Sống mũi: 10 đỉnh sống mũi, 11-12 thân sống mũi, 13 chân sống mũi (không phải chóp mũi)"

  - name: mattrai
    point_range: [14, 21]
    point_count: 8
    closed: true
    proportions: [0.00, 0.21, 0.48, 0.76, 1.00, 0.76, 0.50, 0.24]
    opposite_eyelid_pairs: [[15, 21], [16, 20], [17, 19]]
    description: "Mắt trái (nhìn trên ảnh): 14 khoé ngoài, 15-17 mí trên, 18 khoé trong, 19-21 mí dưới"

  - name: matphai
    point_range: [22, 29]
    point_count: 8
    closed: true
    proportions: [0.00, 0.23, 0.51, 0.79, 1.00, 0.78, 0.52, 0.25]
    opposite_eyelid_pairs: [[23, 29], [24, 28], [25, 27]]
    description: "Mắt phải (nhìn trên ảnh): 22 khoé trong, 23-25 mí trên, 26 khoé ngoài, 27-29 mí dưới"

  - name: moingoai
    point_range: [30, 41]
    point_count: 12
    closed: true
    proportions: [0.00, 0.18, 0.41, 0.53, 0.65, 0.85, 1.00, 0.87, 0.72, 0.55, 0.35, 0.18]
    description: "Viền môi ngoài: 30 khoé trái, 31-35 bờ môi trên, 36 khoé phải, 37-41 bờ môi dưới"

  - name: moitrong
    point_range: [42, 49]
    point_count: 8
    closed: true
    proportions: [0.00, 0.22, 0.53, 0.82, 1.00, 0.81, 0.53, 0.23]
    description: "Viền môi trong: 42 khoé trong trái, 43-45 mép trong trên, 46 khoé trong phải, 47-49 mép trong dưới"

# 12 Điểm neo theo Mục 5.5 & Mục 8 GL
anchor_points: [0, 4, 5, 9, 10, 13, 14, 18, 22, 26, 30, 36]

# Ngưỡng đánh giá chất lượng (Scoring Quality & Tolerances) - Chưa hiệu chỉnh bằng dữ liệu
scoring_tolerances:
  anchor_point_iod_ratio: 0.03          # Dung sai điểm neo <= 3% IOD (~3 px)
  contour_point_iod_ratio: 0.05         # Dung sai điểm viền <= 5% IOD (~5 px)
  nme_max_threshold: 0.035              # NME toàn ảnh đạt khi <= 0.035 (~3.4 px)
  severity_critical_multiplier: 1.8     # Điểm vượt 1.8 * tolerance coi là CRITICAL
  suspicion_normalizer_multiplier: 2.5  # Chuẩn hóa suspicion e_norm / (2.5 * tolerance)
  occluded_suspicion_discount: 0.6      # Giảm phạt 40% cho điểm occluded
  min_iod_for_norm: 10.0                # Mẫu số tối thiểu max(iod, 10.0) px

# Phân loại Face Scale & Ca khó (Hard cases)
case_classification:
  scale_close_min_iod: 80.0             # IOD >= 80 px -> CLOSE
  scale_normal_min_iod: 38.0            # IOD >= 38 px -> NORMAL, còn lại FAR
  sunglasses_min_eye_occluded: 4        # >= 4/16 điểm mắt occluded/outside
  sunglasses_ai_reliability: 0.45       # Độ tin cậy AI cho kính râm
  occluded_min_total_occluded: 6        # >= 6 điểm toàn mặt occluded/outside
  occluded_ai_reliability: 0.58         # Độ tin cậy AI cho mặt che khuất
  far_max_iod: 35.0                     # IOD < 35 px -> FAR
  far_ai_reliability: 0.65              # Độ tin cậy AI cho mặt nhỏ ở xa
  normal_ai_reliability: 0.95           # Độ tin cậy AI bình thường

# Ngưỡng kiểm định 14 luật (Validation Rules) - Chưa hiệu chỉnh bằng dữ liệu
rules:
  scale_factor:
    base_iod: 96.0                      # IOD trung vị quy đổi
    min_scale: 0.25                     # Giới hạn dưới của scale_factor
    max_scale: 2.5                      # Giới hạn trên của scale_factor

  r04_eyebrow_monotonic:
    min_points_evaluated: 8
    min_tolerance_px: 1.5
    scale_factor_multiplier: 5.0        # max(1.5, 5.0 * scale_factor)

  r06_eyelid_tilt:
    min_tolerance_px: 0.8
    scale_factor_multiplier: 2.0        # max(0.8, 2.0 * scale_factor)

  r08_nose_bridge:
    max_ratio: 1.55                     # Giữ 1.55 theo code hiện hành (spec cũ 1.45)
    min_segment_length_px: 1.0

  r09_inner_lip:
    corner_x_min_tolerance_px: 0.8
    corner_x_scale_factor_multiplier: 2.0  # max(0.8, 2.0 * scale_factor)
    contour_tolerance_multiplier: 2.0      # Dung sai tạm = 2.0 * scale_factor px

  r10_skeleton_visibility:
    mattrai: 4      # Ít hơn 4/8 điểm -> Outside cả skeleton
    matphai: 4      # Ít hơn 4/8 điểm -> Outside cả skeleton
    longmaytrai: 3  # Ít hơn 3/5 điểm -> Outside cả skeleton
    longmayphai: 3  # Ít hơn 3/5 điểm -> Outside cả skeleton
    moingoai: 6     # Ít hơn 6/12 điểm -> Outside cả skeleton
    moitrong: 4     # Ít hơn 4/8 điểm -> Outside cả skeleton
    songmui: 1      # Chỉ Outside khi cả 4 điểm khuất

  r12_coincident_points:
    min_threshold_px: 0.4
    iod_ratio_multiplier: 0.012         # max(0.4, 0.012 * IOD)

  r13_temporal_jump:
    min_jump_px: 5.0
    scale_factor_multiplier: 15.0       # max(5.0, 15.0 * scale_factor) (thay vì tĩnh 15 px)

  r14_occluded_drift:
    max_drift_iod_ratio: 0.15           # 15% IOD

# Ngưỡng hình học và IOD (Geometry) - Chưa hiệu chỉnh bằng dữ liệu
geometry:
  iod:
    min_eye_points: 4                   # Ít nhất 4 điểm mỗi mắt để tính tâm
    min_eye_center_dist: 10.0           # Khoảng cách 2 tâm mắt tối thiểu
    outer_corners_min_dist: 5.0         # Fallback 1: khoảng cách khóe ngoài tối thiểu
    outer_corners_ratio: 0.65           # Fallback 1: 0.65 * outer_dist
    face_width_min_points: 8            # Fallback 2: tối thiểu 8 điểm không outside
    face_width_min_px: 10.0             # Fallback 2: bề rộng bbox mặt tối thiểu
    face_width_min_result_px: 12.0      # Fallback 2: max(12.0, face_width * 0.42)
    face_width_ratio: 0.42              # Fallback 2: hệ số bbox
    default_iod_px: 96.0                # Fallback 3: mặc định nếu không đủ dữ liệu

# Ghép khuôn mặt Annotation - Detection (Matching)
matching:
  cutoff_iod_multiplier: 2.0            # Ngưỡng cắt không ghép nếu dist > 2.0 * IOD
