# 12 Điểm neo theo Mục 5.5 & Mục 8 GL
anchor_points: [0, 4, 5, 9, 10, 13, 14, 18, 22, 26, 30, 36]

# Ngưỡng sai số theo Mục 8 GL (tỉ lệ IOD)
tolerances:
  anchor_point_iod_ratio: 0.03        # 3% IOD (~3 px)
  contour_point_iod_ratio: 0.05       # 5% IOD (~5 px)
  nme_max_threshold: 0.035            # NME toàn ảnh <= 0.035 (~3.4 px)
  temporal_jump_max_px: 15.0          # Nhảy giữa 2 frame liên tiếp <= 15 px (Mục 6.9)
  bridge_segment_max_ratio: 1.45      # Tỉ lệ đoạn sống mũi dài nhất / ngắn nhất <= 1.45

# Ngưỡng ẩn cả skeleton theo Mục 4.2 GL
skeleton_visibility_thresholds:
  mattrai: 4      # Ít hơn 4/8 điểm -> Outside cả skeleton
  matphai: 4      # Ít hơn 4/8 điểm -> Outside cả skeleton
  longmaytrai: 3  # Ít hơn 3/5 điểm -> Outside cả skeleton
  longmayphai: 3  # Ít hơn 3/5 điểm -> Outside cả skeleton
  moingoai: 6     # Ít hơn 6/12 điểm -> Outside cả skeleton
  moitrong: 4     # Ít hơn 4/8 điểm -> Outside cả skeleton
  songmui: 1      # Chỉ Outside khi cả 4 điểm khuất
